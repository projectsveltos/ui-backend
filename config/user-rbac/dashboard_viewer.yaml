# ClusterRole to bind to users who can see everything the Sveltos dashboard shows.
# Keep in sync with the SubjectAccessReviews issued in internal/server/k8s-utils.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sveltos-dashboard-viewer
rules:
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - config.projectsveltos.io
  resources:
  - clusterprofiles
  - clustersummaries
  - profiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lib.projectsveltos.io
  resources:
  - classifiers
  - eventtriggers
  - managementclusterclassifiers
  - sveltosclusters
  verbs:
  - get
  - list
  - watch
